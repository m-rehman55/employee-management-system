{% extends "base.html" %}
{% block title %}Forgot Password — Apex EMS{% endblock %}
{% block auth_content %}
<div class="row justify-content-center align-items-center" style="min-height: 75vh;">
  <div class="col-md-5 col-lg-4">
    <div class="card shadow-lg border-0"><div class="card-body p-4 p-md-5">
      <h3 class="fw-bold mb-2">Reset your password</h3>
      <p class="text-muted small mb-4">Enter your username or work email. If the account exists, reset instructions will be issued.</p>
      <form method="POST">
        <label for="identity" class="form-label fw-semibold">Username or work email</label>
        <input id="identity" name="identity" class="form-control mb-3" required autofocus>
        <button class="btn btn-primary w-100">Send reset instructions</button>
      </form>
      <a href="{{ url_for('auth.login') }}" class="d-block text-center small mt-3">Back to sign in</a>
    </div></div>
  </div>
</div>
{% endblock %}
