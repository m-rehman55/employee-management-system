{% extends "base.html" %}
{% block title %}Set New Password — Apex EMS{% endblock %}
{% block auth_content %}
<div class="row justify-content-center align-items-center" style="min-height: 75vh;">
  <div class="col-md-5 col-lg-4"><div class="card shadow-lg border-0"><div class="card-body p-4 p-md-5">
    <h3 class="fw-bold mb-2">Set a new password</h3>
    <p class="text-muted small mb-4">Use at least 10 characters. This link can only be used once.</p>
    <form method="POST">
      <label for="password" class="form-label fw-semibold">New password</label>
      <input id="password" name="password" type="password" class="form-control mb-3" minlength="10" required>
      <label for="confirmation" class="form-label fw-semibold">Confirm password</label>
      <input id="confirmation" name="confirmation" type="password" class="form-control mb-4" minlength="10" required>
      <button class="btn btn-primary w-100">Update password</button>
    </form>
  </div></div></div>
</div>
{% endblock %}
