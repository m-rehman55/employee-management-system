{% extends "base.html" %}
{% block title %}Change Password — Apex EMS{% endblock %}
{% block page_title %}Change Password{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-lg-6"><div class="card shadow-sm"><div class="card-body p-4">
  <h4 class="fw-bold">Change your password</h4>
  <p class="text-muted">Use a strong password of at least 10 characters.</p>
  <form method="POST">
    <label class="form-label" for="current_password">Current password</label>
    <input class="form-control mb-3" id="current_password" name="current_password" type="password" required>
    <label class="form-label" for="password">New password</label>
    <input class="form-control mb-3" id="password" name="password" type="password" minlength="10" required>
    <label class="form-label" for="confirmation">Confirm new password</label>
    <input class="form-control mb-4" id="confirmation" name="confirmation" type="password" minlength="10" required>
    <button class="btn btn-primary">Update password</button>
  </form>
</div></div></div></div>
{% endblock %}
