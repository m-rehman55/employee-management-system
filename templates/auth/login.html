{% extends "base.html" %}

{% block title %}Sign In — Employee Management System{% endblock %}

{% block auth_content %}
<div class="row justify-content-center align-items-center" style="min-height: 75vh;">
    <div class="col-md-5 col-lg-4">
        <div class="card shadow-lg border-0">
            <div class="card-body p-4 p-md-5">
                <div class="text-center mb-4">
                    <div class="d-inline-flex align-items-center justify-content-center bg-primary bg-opacity-10 text-primary rounded-circle mb-3" style="width: 64px; height: 64px;">
                        <i class="bi bi-building-lock fs-1"></i>
                    </div>
                    <h3 class="fw-bold mb-1">Apex EMS</h3>
                    <p class="text-muted small">Employee Management System Portal</p>
                </div>

                <form method="POST" action="{{ url_for('auth.login', next=request.args.get('next')) }}">
                    <div class="mb-3">
                        <label for="username" class="form-label fw-semibold">Username</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light"><i class="bi bi-person"></i></span>
                            <input type="text" class="form-control" id="username" name="username" value="{{ saved_username or username or '' }}" placeholder="Enter username" required autofocus>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="password" class="form-label fw-semibold">Password</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light"><i class="bi bi-key"></i></span>
                            <input type="password" class="form-control" id="password" name="password" placeholder="Enter password" required>
                        </div>
                    </div>

                    <div class="d-flex justify-content-between align-items-center mb-4">
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="remember_me" name="remember_me" {% if saved_username %}checked{% endif %}>
                            <label class="form-check-label small" for="remember_me">
                                Remember username (Cookie)
                            </label>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">
                        <i class="bi bi-box-arrow-in-right me-2"></i>Sign In
                    </button>
                </form>

                <div class="text-center mt-3">
                    <a href="{{ url_for('auth.forgot_password') }}" class="small">Forgot your password?</a>
                </div>

                <p class="mt-4 mb-0 text-center text-muted small">
                    Use the account provided by your system administrator.
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
